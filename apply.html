<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Leave - Employee Leave Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            color: #333;
        }

        header {
            background: #243b55;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #141e30;
            padding: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
        }

        nav a:hover,
        nav a.active {
            background: #3498db;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        .form-box h2 {
            color: #243b55;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .submit-btn {
            width: 100%;
            background: #3498db;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 25px;
        }

        .submit-btn:hover {
            background: #217dbb;
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Leave Management System</h1>
    <p>Manage Employee Leave Requests Easily</p>
</header>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="apply.html" class="active">
        Apply Leave
    </a>

    <a href="details.html">
        Leave Details
    </a>

    <a href="about.html">
        About
    </a>

</nav>


<div class="container">

    <div class="form-box">

        <h2>Apply for Leave</h2>

        <!-- Error message -->
        <div id="errorMessage" class="error"></div>

        <!-- Success message -->
        <div id="successMessage" class="success"></div>


        <form id="leaveForm">

            <label for="employeeId">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeId"
                placeholder="Enter Employee ID"
                required
            >


            <label for="employeeName">
                Employee Name
            </label>

            <input
                type="text"
                id="employeeName"
                placeholder="Enter Employee Name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >


            <label for="leaveDate">
                Leave Date
            </label>

            <input
                type="date"
                id="leaveDate"
                required
            >


            <label for="days">
                Number of Leave Days
            </label>

            <input
                type="number"
                id="days"
                min="1"
                placeholder="Enter number of days"
                required
            >


            <label for="description">
                Leave Description
            </label>

            <textarea
                id="description"
                placeholder="Enter reason for leave"
                required
            ></textarea>


            <button type="submit" class="submit-btn">
                Apply Leave
            </button>

        </form>

    </div>

</div>


<footer>
    <p>
        Employee Leave Management System | All Rights Reserved
    </p>
</footer>


<script>

/* ===============================
   VALID EMPLOYEE DETAILS
================================ */

const employees = [

    {
        id: "1",
        name: "Ravi Kumar",
        email: "ravi@gmail.com"
    },

    {
        id: "2",
        name: "Sita Rani",
        email: "sita@gmail.com"
    },

    {
        id: "3",
        name: "Arjun Reddy",
        email: "arjun@gmail.com"
    },

    {
        id: "4",
        name: "Priya Sharma",
        email: "priya@gmail.com"
    },

    {
        id: "5",
        name: "Kiran Kumar",
        email: "kiran@gmail.com"
    }

];


/* ===============================
   FORM SUBMISSION
================================ */

document
.getElementById("leaveForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    /* Get entered values */

    let employeeId =
        document.getElementById("employeeId")
        .value.trim();

    let employeeName =
        document.getElementById("employeeName")
        .value.trim();

    let email =
        document.getElementById("email")
        .value.trim();

    let leaveDate =
        document.getElementById("leaveDate")
        .value;

    let days =
        document.getElementById("days")
        .value;

    let description =
        document.getElementById("description")
        .value.trim();


    let errorMessage =
        document.getElementById("errorMessage");

    let successMessage =
        document.getElementById("successMessage");


    /* Hide previous messages */

    errorMessage.style.display = "none";
    successMessage.style.display = "none";


    /* ===============================
       CHECK EMPLOYEE DETAILS
    ================================ */

    let employee = employees.find(function(emp) {

        return (
            emp.id === employeeId &&
            emp.name.toLowerCase() ===
            employeeName.toLowerCase() &&
            emp.email.toLowerCase() ===
            email.toLowerCase()
        );

    });


    /* Invalid employee */

    if (!employee) {

        errorMessage.innerHTML =
            "Invalid Employee Details!<br>" +
            "Please enter correct Employee ID, Name and Email.";

        errorMessage.style.display = "block";

        return;
    }


    /* ===============================
       CHECK LEAVE DATE
    ================================ */

    if (leaveDate === "") {

        errorMessage.innerHTML =
            "Please select a leave date.";

        errorMessage.style.display = "block";

        return;
    }


    /* ===============================
       CHECK NUMBER OF DAYS
    ================================ */

    if (days === "" || Number(days) < 1) {

        errorMessage.innerHTML =
            "Please enter a valid number of leave days.";

        errorMessage.style.display = "block";

        return;
    }


    /* ===============================
       CHECK DESCRIPTION
    ================================ */

    if (description === "") {

        errorMessage.innerHTML =
            "Please enter the leave description.";

        errorMessage.style.display = "block";

        return;
    }


    /* ===============================
       GET OLD LEAVE RECORDS
    ================================ */

    let leaves =
        JSON.parse(
            localStorage.getItem("leaveRecords")
        ) || [];


    /* ===============================
       CREATE NEW LEAVE
    ================================ */

    let newLeave = {

        employeeId: employeeId,

        employeeName: employeeName,

        email: email,

        leaveDate: leaveDate,

        days: Number(days),

        description: description

    };


    /* Add new record */

    leaves.push(newLeave);


    /* ===============================
       SAVE TO LOCAL STORAGE
    ================================ */

    localStorage.setItem(
        "leaveRecords",
        JSON.stringify(leaves)
    );


    /* ===============================
       SUCCESS MESSAGE
    ================================ */

    successMessage.innerHTML =
        "Leave applied successfully!";

    successMessage.style.display = "block";


    /*
       Automatically go to
       details.html after 1 second
    */

    setTimeout(function() {

        window.location.href = "details.html";

    }, 1000);

});

</script>

</body>
</html>
